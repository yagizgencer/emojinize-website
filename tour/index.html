<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Welcome tour · Emojinize</title>
  <meta name="description" content="A two minute walkthrough of everything Emojinize can do: whole pages, just the part you select, your own text, and your display settings.">
  <link rel="canonical" href="https://emojinize.com/tour/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Emojinize">
  <meta property="og:title" content="Welcome tour · Emojinize">
  <meta property="og:description" content="A two minute walkthrough of everything Emojinize can do.">
  <meta property="og:url" content="https://emojinize.com/tour/">
  <meta property="og:image" content="https://emojinize.com/assets/icons/store128.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191b" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon16.png">
  <link rel="apple-touch-icon" href="/assets/icons/store128.png">
  <link rel="stylesheet" href="/assets/site.css">
  <script>document.documentElement.classList.add("js");</script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/samples.js" defer></script>
  <script src="/assets/site.js" defer></script>
  <script src="/assets/tour.js" defer></script>
</head>
<body>
  <header class="snav" data-emojinize="ui">
    <a class="slogo" href="/"><img src="/assets/icons/mark40.png" srcset="/assets/icons/mark40.png 48w, /assets/icons/mark60.png 72w, /assets/icons/mark80.png 96w, /assets/icons/mark120.png 144w" sizes="(min-width: 1100px) 38px, 29px" width="29" height="24" alt="">Emojinize</a>
    <nav class="links" aria-label="Site">
      <a href="/">Home</a>
      <a href="/write/">Write</a>
      <a href="/tour/" aria-current="page">Tour</a>
      <a href="/feedback/">Feedback</a>
      <a href="/privacy/">Privacy</a>
    </nav>
    <a class="storelink" href="https://chromewebstore.google.com/detail/cbofieekacidabdkojipfaokcahhbplm" data-store="nav">Chrome Store<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3H3.5A1.5 1.5 0 0 0 2 4.5v6A1.5 1.5 0 0 0 3.5 12h6a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M8.5 2H12v3.5M12 2L6.5 7.5"/></svg></a>
  </header>

  <!-- With the extension installed, it sets <html data-emojinize-tour="host">
       and runs the tour in #step, #rail, #dots, #back and #next.
       Only the tour's own controls are marked data-emojinize="ui": the
       extension emojinizes the sample story inside #step, as the tour asks. -->
  <main class="pg pg-tour">
    <div class="banner" data-when="new" data-emojinize="ui">
      <span class="e" aria-hidden="true">🧩</span>
      <div><b>The tour runs with the extension.</b> Add Emojinize to Chrome and this tour opens by itself, driven by the real menu, right click and shortcuts.</div>
      <a class="sbtn primary sm" href="https://chromewebstore.google.com/detail/cbofieekacidabdkojipfaokcahhbplm" data-store="tour">Add to Chrome</a>
    </div>

    <div class="trail">
      <ol class="rail" id="rail" aria-label="Steps" data-emojinize="ui"></ol>
      <div class="tmain">
        <section class="scard tcard" id="step" aria-label="Current step">
          <noscript><p class="note">The tour needs JavaScript to run.</p></noscript>
        </section>
        <nav class="tnav" aria-label="Tour" data-emojinize="ui">
          <button class="sbtn ghost" id="back" type="button">Back</button>
          <div class="dots" id="dots" role="img"></div>
          <button class="sbtn primary" id="next" type="button">Next</button>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
